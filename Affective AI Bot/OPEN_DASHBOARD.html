<!DOCTYPE html>
<html>
<head>
    <title>🎭 AffectiveCore - Quick Access</title>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://localhost:8501">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 48px; margin-bottom: 20px; }
        p { font-size: 20px; margin: 10px 0; }
        .links { margin-top: 30px; }
        a {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        a:hover { transform: scale(1.05); }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 AffectiveCore</h1>
        <h2>Speech Emotion Detection</h2>
        <div class="spinner"></div>
        <p>Redirecting to dashboard...</p>
        <p>If not redirected, click below:</p>
        <div class="links">
            <a href="http://localhost:8501" target="_blank">📊 Open Dashboard</a>
            <a href="http://localhost:5000" target="_blank">🔌 API Endpoint</a>
        </div>
        <p style="margin-top: 30px; font-size: 14px; opacity: 0.8;">
            Dashboard: http://localhost:8501<br>
            API: http://localhost:5000<br>
            Network: http://192.168.0.116:8501
        </p>
    </div>
</body>
</html>
